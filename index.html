<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MC-Lite</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MC-Lite">
<meta name="theme-color" content="#101418">
<style>
  :root { color-scheme: dark; --bg:#12161a; --stone:#1c2329; --stone2:#252e36; --edge:#2e3943; --ink:#e6e9ec; --mute:#8d98a3; --grass:#5fa84a; --gold:#e0b341; --red:#e0584c; --lapis:#6c9be0; --dirt:#8a5a37; --gap:14px; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: calc(env(safe-area-inset-top) + 8px) 16px calc(88px + env(safe-area-inset-bottom)); background: var(--bg); color: var(--ink); font: 17px/1.4 -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  h1 { font-size: 15px; font-weight: 700; margin: 4px 0 2px; color: var(--mute); letter-spacing: .01em; }
  h2 { font-size: 16px; font-weight: 700; margin: 26px 0 8px; color: var(--ink); }
  a { color: var(--lapis); text-decoration: none; } small { color: var(--mute); }
  :focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }
  .card { background: var(--stone); border-top: 2px solid var(--edge); border-radius: 6px; padding: 16px; margin: var(--gap) 0; }
  button { width: 100%; min-height: 50px; font: inherit; font-weight: 700; padding: 13px 16px; border: 0; border-radius: 6px; background: var(--grass); color: #0c1a08; margin-top: 10px; }
  button:active { filter: brightness(.88); } button[disabled] { opacity: .45; }
  button.alt { background: var(--stone2); color: var(--ink); } button.warn { background: var(--gold); color: #1c1200; }
  input, textarea, select { width: 100%; font: inherit; padding: 13px 14px; border-radius: 6px; border: 1px solid var(--edge); background: #0d1114; color: inherit; }
  textarea { min-height: 96px; resize: vertical; margin-top: 10px; }
  .nav { text-align: right; margin: 0; font-size: 15px; } .bar { margin: 6px 0 10px; } .empty { color: var(--mute); }
  .head { font-size: 25px; line-height: 1.2; font-weight: 800; margin: 10px 0 4px; } .head.bad { color: var(--red); } .head.ok { color: var(--ink); }
  .sub { color: var(--mute); font-size: 14px; margin: 0 0 6px; }
  .acc { margin: 0 0 18px; } .acc:last-child { margin-bottom: 0; }
  .acc .who { display: flex; align-items: baseline; gap: 8px; } .acc .who b { font-size: 18px; text-transform: capitalize; } .acc .who small { margin-left: auto; font-size: 13px; }
  .meter { display: grid; grid-template-columns: 54px 1fr 92px; align-items: center; gap: 8px; margin-top: 7px; font-size: 13px; color: var(--mute); }
  .meter .pct { text-align: right; color: var(--ink); font-weight: 700; } .meter .pct small { font-weight: 400; display: block; font-size: 12px; }
  .cells { display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px; } .cells i { height: 16px; background: var(--stone2); border-radius: 1px; }
  .cells.ok i.on { background: var(--grass); } .cells.warn i.on { background: var(--gold); } .cells.bad i.on { background: var(--red); } .acc.stale .cells i.on { opacity: .4; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: var(--gap) 0; } .tile { background: var(--stone); border-top: 2px solid var(--edge); border-radius: 6px; padding: 12px 14px; color: inherit; display: block; }
  .tile b { display: block; font-size: 28px; line-height: 1.1; } .tile span { font-size: 13px; color: var(--mute); } .tile.bad b { color: var(--red); } .tile.ok b { color: var(--grass); } .tile.wide { grid-column: 1 / -1; }
  .reds { margin: 8px 0 0; color: var(--mute); font-size: 14px; word-break: break-word; }
  .run { display: block; background: var(--stone); border-top: 2px solid var(--edge); border-left: 5px solid var(--edge); border-radius: 6px; padding: 12px 14px; margin: 10px 0; color: inherit; } .run.queued { opacity: .65; }
  .top { display: flex; align-items: center; gap: 8px; } .age { margin-left: auto; color: #cfd8e0; }
  .badge { color: #0c1014; font-weight: 800; font-size: 13px; padding: 2px 9px; border-radius: 3px; } .acct { color: var(--mute); font-size: 14px; }
  .what { margin: 8px 0 2px; } .last { color: var(--mute); font-size: 15px; margin-top: 4px; }
  details.done { background: var(--stone); border-top: 2px solid var(--edge); border-radius: 6px; padding: 12px 16px; margin: 18px 0; } summary { font-weight: 700; }
  .end { padding: 8px 0; border-top: 1px solid var(--edge); font-size: 15px; } .end:first-of-type { border-top: 0; }
  pre { font: 12px/1.35 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word; margin: 0; color: #cfd8e0; }
  button.rf { width: auto; min-height: 36px; padding: 6px 14px; margin: 0 14px 0 0; font-size: 15px; }
  .tokline { color: var(--mute); font-size: 13px; margin-top: 4px; } .acct.model { opacity: .85; }
  .srow { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 8px 0; border-bottom: 1px solid var(--edge); font-size: 14px; } .srow:last-child { border-bottom: 0; } .srow b { flex: 1 0 100%; font-size: 16px; }
  .rq { display: block; background: var(--stone); border-top: 2px solid var(--edge); border-radius: 6px; padding: 12px 14px; margin: 10px 0; color: inherit; } .rq .what { font-weight: 700; }
  .chip { font-size: 13px; font-weight: 800; padding: 2px 9px; border-radius: 3px; color: #0c1014; background: var(--gold); } .chip.working { background: var(--lapis); } .chip.done { background: var(--grass); }
  nav#tabs a span { position: absolute; top: 3px; right: 2px; font-size: 11px; line-height: 1.3; color: #fff; background: var(--red); border-radius: 8px; padding: 0 5px; } nav#tabs a span:empty { display: none; }   /* count pills take no width: six tabs fit even with two of them */
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); display: inline-block; }
  .result { background: #16261a; border-left: 4px solid var(--grass); border-radius: 4px; padding: 10px 12px; margin: 8px 0; font-size: 16px; }
  .undo { background: var(--stone2); border-radius: 6px; padding: 10px 12px; margin: 8px 0; } .undo small { display: block; word-break: break-word; } .undo button { margin-top: 8px; min-height: 44px; }
  .dashbox { margin: 8px 0; } .dashbox iframe.dash { width: 100%; height: 360px; border: 1px solid var(--edge); border-radius: 6px; background: #fff; } .dashbox.fs { position: fixed; inset: 0; z-index: 20; background: var(--bg); padding: 8px; } .dashbox.fs iframe.dash { height: calc(100% - 64px); }
  code { font: 14px ui-monospace, monospace; background: #0d1114; padding: 1px 4px; border-radius: 3px; }
  nav#tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: #0e1215; border-top: 1px solid var(--edge); padding-bottom: env(safe-area-inset-bottom); }
  nav#tabs[hidden] { display: none; } nav#tabs a { flex: 1; min-width: 0; text-align: center; padding: 16px 0 14px; position: relative; font-size: 11.5px; white-space: nowrap; font-weight: 700; color: var(--mute); } nav#tabs a.on { color: var(--ink); box-shadow: inset 0 3px 0 var(--grass); }
  .fillrow { display: flex; align-items: center; gap: 14px; } .fillrow .step { width: 76px; margin: 0; font-size: 30px; padding: 12px 0; } .big { flex: 1; text-align: center; font-size: 46px; font-weight: 800; line-height: 1.05; } .big small { display: block; font-size: 14px; font-weight: 400; }
  .qtext { margin: 8px 0 4px; font-size: 19px; } button.opt { text-align: left; }
  .msg { padding: 10px 0; border-top: 1px solid var(--edge); } .msg:first-child { border-top: 0; } .msg .who { font-size: 13px; color: var(--mute); } .msg .who b { color: var(--ink); } .msg .who .x { color: var(--gold); }
  .msg.dan .who b { color: var(--grass); } .msg .t { white-space: pre-wrap; word-break: break-word; font-size: 16px; margin-top: 2px; }
  .types { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0 6px; } .types button { margin: 0; min-height: 44px; font-size: 15px; padding: 8px; }
  .types button.on { background: var(--grass); color: #0c1a08; } .types button.on[data-ty="urgent"] { background: var(--red); color: #1a0604; } .types button.on[data-ty="announce"] { background: var(--gold); color: #1c1200; } .types button.on[data-ty="info"] { background: var(--lapis); color: #08121f; }
  .ok { color: #7fd47f; } .bad { color: var(--red); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style></head>
<body>
<h1>MC-Lite</h1>
<div id="app"></div>
<nav id="tabs" hidden><a href="#/" data-t="home">Home</a><a href="#/stats" data-t="stats">Stats</a><a href="#/bus" data-t="bus">Talk</a><a href="#/controls" data-t="controls">Controls</a><a href="#/questions" data-t="questions">Questions<span id="qn"></span></a><a href="#/requests" data-t="requests">Requests<span id="rn"></span></a></nav>
<script src="subs.js"></script>
<script src="runs.js"></script>
<script src="home.js"></script>
<script src="controls.js"></script>
<script src="requests.js"></script>
<script src="app.js"></script>
</body></html>
